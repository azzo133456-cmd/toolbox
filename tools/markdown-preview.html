<script>
document.getElementById('year').textContent = new Date().getFullYear();
const inputArea = document.getElementById('inputArea');
const previewArea = document.getElementById('previewArea');

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineFormat(text) {
  let s = escHtml(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%;">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}

function parseMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let i = 0;
  let inCode = false, codeBuf = [];
  let listStack = null; // {type, html}
  let paraBuf = [];

  function flushPara() {
    if (paraBuf.length) {
      html.push('<p>' + inlineFormat(paraBuf.join(' ')) + '</p>');
      paraBuf = [];
    }
  }
  function closeList() {
    if (listStack) { html.push(listStack.type === 'ul' ? '</ul>' : '</ol>'); listStack = null; }
  }

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flushPara(); closeList();
      if (!inCode) { inCode = true; codeBuf = []; }
      else { html.push('<pre><code>' + escHtml(codeBuf.join('\n')) + '</code></pre>'); inCode = false; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }

    if (!line.trim()) { flushPara(); closeList(); i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); closeList(); const lvl = h[1].length; html.push(`<h${lvl}>${inlineFormat(h[2])}</h${lvl}>`); i++; continue; }

    if (/^(---|\*\*\*|___)\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }

    const bq = line.match(/^>\s?(.*)$/);
    if (bq) { flushPara(); closeList(); html.push(`<blockquote>${inlineFormat(bq[1])}</blockquote>`); i++; continue; }

    const ul = line.match(/^(\s*)[-*+]\s+(.*)$/);
    const ol = line.match(/^(\s*)\d+\.\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const type = ul ? 'ul' : 'ol';
      if (!listStack || listStack.type !== type) { closeList(); html.push(type === 'ul' ? '<ul>' : '<ol>'); listStack = { type }; }
      html.push(`<li>${inlineFormat((ul || ol)[2])}</li>`);
      i++; continue;
    }

    if (line.includes('|') && lines[i+1] && /^\s*\|?[\s:-]+\|[\s:|:-]*$/.test(lines[i+1])) {
      flushPara(); closeList();
      const headerCells = line.split('|').map(c => c.trim()).filter((c,idx,arr) => !(c==='' && (idx===0||idx===arr.length-1)));
      const rows = [];
      let j = i + 2;
      while (j < lines.length && lines[j].includes('|')) {
        const cells = lines[j].split('|').map(c => c.trim()).filter((c,idx,arr) => !(c==='' && (idx===0||idx===arr.length-1)));
        rows.push(cells); j++;
      }
      let t = '<table><thead><tr>' + headerCells.map(c => `<th>${inlineFormat(c)}</th>`).join('') + '</tr></thead><tbody>';
      rows.forEach(r => { t += '<tr>' + r.map(c => `<td>${inlineFormat(c)}</td>`).join('') + '</tr>'; });
      t += '</tbody></table>';
      html.push(t);
      i = j; continue;
    }

    closeList();
    paraBuf.push(line.trim());
    i++;
  }
  flushPara(); closeList();
  if (inCode) html.push('<pre><code>' + escHtml(codeBuf.join('\n')) + '</code></pre>');
  return html.join('\n');
}

function render() {
  previewArea.innerHTML = parseMarkdown(inputArea.value);
}

inputArea.addEventListener('input', render);
document.getElementById('clearInput').addEventListener('click', () => { inputArea.value=''; render(); });
render();
</script>
</body>
