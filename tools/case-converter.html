<script src="../js/main.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const inputArea = document.getElementById('inputArea');
const outputArea = document.getElementById('outputArea');

function toWords(str) {
  return str
    .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
    .replace(/[_\-]+/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .map(w => w.toLowerCase());
}

const converters = {
  upper: s => s.toUpperCase(),
  lower: s => s.toLowerCase(),
  title: s => toWords(s).map(w => w[0].toUpperCase() + w.slice(1)).join(' '),
  sentence: s => { const w = toWords(s).join(' '); return w ? w[0].toUpperCase() + w.slice(1) : ''; },
  camel: s => toWords(s).map((w,i) => i === 0 ? w : w[0].toUpperCase() + w.slice(1)).join(''),
  pascal: s => toWords(s).map(w => w[0].toUpperCase() + w.slice(1)).join(''),
  snake: s => toWords(s).join('_'),
  kebab: s => toWords(s).join('-'),
  constant: s => toWords(s).join('_').toUpperCase(),
};

let lastFn = 'title';
function run(fn) {
  lastFn = fn;
  outputArea.textContent = converters[fn](inputArea.value);
}

document.querySelectorAll('.case-btn-grid .btn').forEach(btn => {
  btn.addEventListener('click', () => run(btn.dataset.fn));
});
inputArea.addEventListener('input', () => run(lastFn));
document.getElementById('clearInput').addEventListener('click', () => { inputArea.value=''; run(lastFn); });
document.getElementById('copyOutput').addEventListener('click', (e) => copyText(outputArea.textContent, e.target));

run('title');
</script>
