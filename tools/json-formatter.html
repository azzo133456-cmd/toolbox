<main>
  <div class="breadcrumb"><a href="../index.html">首頁</a> / JSON 格式化 / 驗證</div>
  <h1 class="page-title">JSON 格式化 / 驗證</h1>
  <p class="page-desc">貼上 JSON 內容,即時美化縮排、壓縮成單行,或檢查格式是否合法。</p>

  <div class="controls-row">
    <label>縮排
      <select id="indentSize">
        <option value="2">2 個空白</option>
        <option value="4">4 個空白</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <button class="btn btn-primary" id="beautifyBtn">美化</button>
    <button class="btn" id="minifyBtn">壓縮成一行</button>
    <button class="btn" id="sortKeysBtn">依 Key 排序</button>
  </div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">
        <span>輸入</span>
        <div class="actions">
          <button class="btn" id="loadSample">載入範例</button>
          <button class="btn" id="clearInput">清空</button>
        </div>
      </div>
      <textarea id="inputArea" placeholder='貼上 JSON...'>{"name":"Alice","age":30,"tags":["admin","user"],"active":true}</textarea>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>輸出</span>
        <div class="actions">
          <button class="btn" id="copyOutput">複製</button>
          <button class="btn btn-primary" id="downloadOutput">下載</button>
        </div>

    </div>

    <p>若 JSON 格式有誤,下方會顯示錯誤訊息。「依 Key 排序」會遞迴排序物件內所有欄位名稱,方便比對兩份 JSON 的差異。</p>

<script src="../js/main.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const inputArea = document.getElementById('inputArea');
const outputArea = document.getElementById('outputArea');
const indentSize = document.getElementById('indentSize');
const statusMsg = document.getElementById('statusMsg');
let sortKeys = false;

function getIndent() {
  const v = indentSize.value;
  return v === 'tab' ? '\t' : Number(v);
}

function sortObjectKeys(obj) {
  if (Array.isArray(obj)) return obj.map(sortObjectKeys);
  if (obj !== null && typeof obj === 'object') {
    const sorted = {};
    Object.keys(obj).sort().forEach(k => { sorted[k] = sortObjectKeys(obj[k]); });
    return sorted;
  }
  return obj;
}

function run(mode) {
  const text = inputArea.value;
  if (!text.trim()) { outputArea.textContent = ''; setStatus(statusMsg, ''); return; }
  try {
    let data = JSON.parse(text);
    if (sortKeys) data = sortObjectKeys(data);
    let out;
    if (mode === 'minify') out = JSON.stringify(data);
    else out = JSON.stringify(data, null, getIndent());
    outputArea.textContent = out;
    setStatus(statusMsg, 'JSON 格式正確');
  } catch (e) {
    outputArea.textContent = '';
    setStatus(statusMsg, '格式錯誤:' + e.message, true);
  }
}

document.getElementById('beautifyBtn').addEventListener('click', () => run('beautify'));
document.getElementById('minifyBtn').addEventListener('click', () => run('minify'));
document.getElementById('sortKeysBtn').addEventListener('click', () => { sortKeys = !sortKeys; document.getElementById('sortKeysBtn').classList.toggle('btn-primary', sortKeys); run('beautify'); });
inputArea.addEventListener('input', () => run('beautify'));
indentSize.addEventListener('change', () => run('beautify'));

document.getElementById('loadSample').addEventListener('click', () => {
  inputArea.value = '{"name":"Alice","age":30,"tags":["admin","user"],"active":true,"address":{"city":"Taipei","zip":"100"}}';
  run('beautify');
});
document.getElementById('clearInput').addEventListener('click', () => { inputArea.value = ''; run('beautify'); });
document.getElementById('copyOutput').addEventListener('click', (e) => copyText(outputArea.textContent, e.target));
document.getElementById('downloadOutput').addEventListener('click', () => downloadText('data.json', outputArea.textContent, 'application/json'));

run('beautify');
</script>
</body>
