<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 拆分 | 小工具箱</title>
<meta name="description" content="免費線上 PDF 拆分工具,可依頁碼範圍擷取,或把每一頁拆成獨立 PDF 打包下載,檔案不上傳伺服器。">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="../index.html"><span class="logo-mark">🧰</span> 小工具箱</a>
    <nav class="main-nav">
      <a href="../index.html#converters">格式轉換</a>
      <a href="../index.html#pdf">PDF 工具</a>
      <a href="../index.html#files">檔案處理</a>
    </nav>
  </div>
</header>

<main>
  <div class="breadcrumb"><a href="../index.html">首頁</a> / PDF 拆分</div>
  <h1 class="page-title">PDF 拆分</h1>
  <p class="page-desc">上傳 PDF 檔案,依頁碼範圍擷取成新檔案,或把每一頁拆成獨立 PDF 打包成 zip 下載。全部在瀏覽器端處理,檔案不會上傳到伺服器。</p>

  <div class="controls-row">
    <button class="btn btn-primary" id="chooseBtn">選擇 PDF 檔案</button>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
    <span id="fileInfo" style="font-size:0.85rem;color:var(--text-muted);"></span>
  </div>

  <div id="optionsWrap" style="display:none;">
    <div class="controls-row">
      <label><input type="radio" name="mode" value="range" checked> 擷取指定頁碼範圍</label>
      <label><input type="radio" name="mode" value="each"> 每頁拆成獨立 PDF(打包 zip)</label>
    </div>
    <div class="controls-row" id="rangeWrap">
      <label>頁碼範圍(例如 1-3,5,8-9)
        <input type="text" id="rangeInput" placeholder="1-3,5" style="width:220px;">
      </label>
    </div>
    <div class="controls-row">
      <button class="btn btn-primary" id="runBtn">執行並下載</button>
    </div>
  </div>
  <div class="status-msg" id="statusMsg"></div>

  <div class="info-box">
    <h4>使用說明</h4>
    <p>頁碼範圍格式支援逗號分隔多段,例如 <code>1-3,5,8-9</code> 代表第 1~3 頁、第 5 頁、第 8~9 頁,頁碼從 1 開始。</p>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> 小工具箱・所有工具皆在瀏覽器端執行,不上傳任何資料</p>
</footer>

<script src="../js/main.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const chooseBtn = document.getElementById('chooseBtn');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const optionsWrap = document.getElementById('optionsWrap');
const rangeWrap = document.getElementById('rangeWrap');
const rangeInput = document.getElementById('rangeInput');
const runBtn = document.getElementById('runBtn');
const statusMsg = document.getElementById('statusMsg');

let currentBuffer = null, currentName = '', pageCount = 0;

chooseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  currentBuffer = await f.arrayBuffer();
  currentName = f.name.replace(/\.pdf$/i, '');
  const { PDFDocument } = PDFLib;
  try {
    const doc = await PDFDocument.load(currentBuffer);
    pageCount = doc.getPageCount();
    fileInfo.textContent = `已載入:${f.name}(共 ${pageCount} 頁)`;
    optionsWrap.style.display = 'block';
    setStatus(statusMsg, '');
  } catch (e) {
    setStatus(statusMsg, '讀取 PDF 失敗:' + e.message, true);
  }
});

document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
  rangeWrap.style.display = document.querySelector('input[name="mode"]:checked').value === 'range' ? 'flex' : 'none';
}));

function parseRanges(str, max) {
  const indices = [];
  str.split(',').map(s => s.trim()).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) throw new Error(`無效的範圍:「${part}」`);
    let start = Number(m[1]), end = m[2] ? Number(m[2]) : Number(m[1]);
    if (start < 1 || end > max || start > end) throw new Error(`範圍超出頁數(1-${max}):「${part}」`);
    for (let i = start; i <= end; i++) indices.push(i - 1);
  });
  return [...new Set(indices)];
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

runBtn.addEventListener('click', async () => {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const { PDFDocument } = PDFLib;
  runBtn.disabled = true;
  try {
    if (mode === 'range') {
      const indices = parseRanges(rangeInput.value, pageCount);
      if (!indices.length) throw new Error('請輸入頁碼範圍');
      setStatus(statusMsg, '處理中...');
      const src = await PDFDocument.load(currentBuffer);
      const out = await PDFDocument.create();
      const pages = await out.copyPages(src, indices);
      pages.forEach(p => out.addPage(p));
      const bytes = await out.save();
      downloadBlob(new Blob([bytes], { type: 'application/pdf' }), `${currentName}-擷取.pdf`);
      setStatus(statusMsg, `完成:擷取了 ${indices.length} 頁`);
    } else {
      setStatus(statusMsg, '處理中,請稍候...');
      const src = await PDFDocument.load(currentBuffer);
      const zip = new JSZip();
      for (let i = 0; i < pageCount; i++) {
        const out = await PDFDocument.create();
        const [p] = await out.copyPages(src, [i]);
        out.addPage(p);
        const bytes = await out.save();
        zip.file(`${currentName}-第${i + 1}頁.pdf`, bytes);
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(blob, `${currentName}-拆分.zip`);
      setStatus(statusMsg, `完成:已拆分成 ${pageCount} 份 PDF 並打包成 zip`);
    }
  } catch (e) {
    setStatus(statusMsg, '處理失敗:' + e.message, true);
  }
  runBtn.disabled = false;
});
</script>
</body>
</html>
